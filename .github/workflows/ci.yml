name: PowerDriveSim verification
on: [push, pull_request]
jobs:
  headless:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure
  desktop:
    runs-on: windows-2022
    env:
      QT_VERSION: 6.5.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt tools
        run: python -m pip install aqtinstall==3.3.0
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qtbase-6.5.3-windows-win64_msvc2019_64
      - name: Install Qt base
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python -m aqt install-qt windows desktop 6.5.3 win64_msvc2019_64 --outputdir "${{ runner.temp }}/qt" --archives qtbase
      - name: Configure desktop
        run: cmake -S . -B build -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DPDS_BUILD_DESKTOP=ON -DCMAKE_PREFIX_PATH="${{ runner.temp }}/qt/6.5.3/msvc2019_64"
      - name: Build desktop
        run: cmake --build build --config Release --parallel 2
      - name: Tests
        shell: pwsh
        run: |
          $env:PATH="${{ runner.temp }}/qt/6.5.3/msvc2019_64/bin;"+$env:PATH
          $env:QT_QPA_FONTDIR='C:/Windows/Fonts'
          ctest --test-dir build -C Release --output-on-failure
